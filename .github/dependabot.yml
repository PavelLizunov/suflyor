# Dependabot — cargo only, GROUPED into one PR per crate per week so updates
# arrive as a reviewable batch (green CI) instead of a swarm. This replaces the
# manual "safe dep bumps" chore. The github-actions ecosystem is intentionally
# omitted (few actions, pinned by major tag, low churn) — add it if you start
# pinning actions by full SHA.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/overlay-backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/slint-experiment"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      slint-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Slint stays on 1.17: with 1.18.1 the mouse wheel cannot reach the end of
    # Settings > AI providers (docs/DEFECT-LEDGER.md, D-018).
    ignore:
      - dependency-name: "slint"
        versions: [">=1.18"]
      - dependency-name: "slint-build"
        versions: [">=1.18"]
      - dependency-name: "i-slint-backend-testing"
        versions: [">=1.18"]

  - package-ecosystem: cargo
    directory: "/suflyor-tts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      tts-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The required checks fail with 1.13.8 (pull request 199); 1.13.6 and 1.13.7
    # were not tried. The update is done by hand.
    ignore:
      - dependency-name: "sherpa-onnx"
        versions: ["1.13.6", "1.13.7", "1.13.8"]
