# Scratch branch claude/ui-shots-1025 only: offscreen renders of the windows
# changed on 2026-10-25. Never merge this file.
name: CI
on:
  workflow_dispatch:
jobs:
  ui-shots:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libudev-dev libdbus-1-dev fonts-liberation
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">' \
            '<fontconfig><alias><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>' \
            '<alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias></fontconfig>' \
            > ~/.config/fontconfig/fonts.conf
          fc-match "Segoe UI"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slint-experiment
      - name: render after (7c7693f)
        env:
          UI_SHOTS_DIR: ${{ github.workspace }}/shots/after
        run: >-
          cargo test --no-default-features --features ui-mcp
          --manifest-path slint-experiment/Cargo.toml --bin overlay-host
          ui_shots::render -- --exact --nocapture
      - name: render before (389e436 UI and translations)
        continue-on-error: true
        env:
          UI_SHOTS_DIR: ${{ github.workspace }}/shots/before
          UI_SHOTS_SET: before
        run: |
          git checkout 389e436 -- slint-experiment/ui slint-experiment/translations
          cargo test --no-default-features --features ui-mcp \
            --manifest-path slint-experiment/Cargo.toml --bin overlay-host \
            ui_shots::render -- --exact --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots
